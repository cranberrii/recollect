name: CI/CD

# PRs to master -> tests only. Push/merge to master -> tests, then deploy.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # --------------------------------------------------------------------------
  # Test gate (runs on every PR and every push). No secrets needed: backend
  # tests fully mock Supabase/scrape/AI, and config fields all default to "".
  # --------------------------------------------------------------------------
  backend-test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-backend-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check app/
      - run: pytest tests/ -v

  web-test:
    runs-on: ubuntu-latest
    concurrency:
      group: test-web-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace=apps/web
      # A successful build is the frontend's test signal (no unit tests yet).
      # NEXT_PUBLIC_* placeholders just satisfy the build; real values are baked
      # in at deploy time by deploy.sh.
      - run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: placeholder
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_API_URL: placeholder

  # --------------------------------------------------------------------------
  # Deploy (only after the gate is green, and only on a push to master).
  # Never cancelled mid-flight so a service is never left half-replaced.
  # --------------------------------------------------------------------------
  deploy:
    needs: [backend-test, web-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-master
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # required for keyless WIF auth
    steps:
      - uses: actions/checkout@v4

      # Only rebuild/redeploy the service that actually changed.
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build, push & deploy
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          SKIP_BACKEND: ${{ steps.filter.outputs.backend == 'true' && '0' || '1' }}
          SKIP_FRONTEND: ${{ steps.filter.outputs.web == 'true' && '0' || '1' }}
        run: ./deploy/deploy.sh
